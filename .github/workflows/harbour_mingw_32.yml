name: Harbour for Windows 32 using MinGW

on:
    workflow_dispatch:
      inputs:
        harbour_ref:
          description: FiveTechSoft/harbour commit to build (empty = master)
          required: false
          default: ''
        release_tag:
          description: Existing release whose harbour_win32_mingw_* asset should be replaced with this build (empty = none)
          required: false
          default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022


    steps:
    - name: Checkout FiveTechSoft/harbour repo
      uses: actions/checkout@v4
      with:
       repository: FiveTechSoft/harbour
       ref: ${{ inputs.harbour_ref }}
       path: harbour

    - name: Install dependencies
      run: |
         (new-object System.Net.WebClient).DownloadFile('https://bitbucket.org/lorenzodla/mod_harbour_actions_resources/downloads/mingw32.zip', 'C:\temp\mingw32.zip')
         Expand-Archive -LiteralPath C:\temp\mingw32.zip -DestinationPath C:\mingw32 -Force
         choco install openssl -y --no-progress
         # 32-bit curl headers for hbcurl (choco curl is 64-bit and never lands in C:\curl)
         (new-object System.Net.WebClient).DownloadFile('https://bitbucket.org/lorenzodla/mod_harbour_actions_resources/downloads/curl-7.54.0-win32-mingw.zip', 'C:\temp\curl-7.54.0-win32-mingw.zip')
         Expand-Archive -LiteralPath C:\temp\curl-7.54.0-win32-mingw.zip -DestinationPath C:\curl -Force
         (new-object System.Net.WebClient).DownloadFile('https://bitbucket.org/lorenzodla/mod_harbour_actions_resources/downloads/acesdk.zip', 'C:\temp\acesdk.zip')
         Expand-Archive -LiteralPath C:\temp\acesdk.zip -DestinationPath C:\acesdk -Force

    - name: Compile and install Harbour
      shell: cmd
      run: |
        cd harbour
        set HB_BUILD_MODE=c
        set HB_USER_PRGFLAGS=-l-
        set HB_BUILD_CONTRIBS=
        set HB_WITH_OPENSSL=C:\OpenSSL\include
        set HB_WITH_CURL=C:\curl\include
        set HB_WITH_ADS=C:\acesdk
        set HB_STATIC_OPENSSL=yes
        set HB_STATIC_CURL=yes
        set HB_COMPILER=mingw
        set HB_BUILD_CONTRIB_DYN=no
        set HB_BUILD_DYN=no
        set path=c:\mingw32\mingw32\bin;%path%
        set HB_INSTALL_PREFIX=%GITHUB_WORKSPACE%\output
        win-make.exe || exit /b 1
        win-make.exe install || exit /b 1
        for %%l in (hbcurl hbwin hbct xhb hbziparc hbmzip minizip hbtip hbhpdf libhpdf hbzebra) do if not exist "%HB_INSTALL_PREFIX%\lib\win\mingw\lib%%l.a" ( echo Missing lib%%l.a & exit /b 1 )

    - name: Get current time
      id: current-time
      shell: pwsh
      run: |
        $time = Get-Date -Format "yyyy_MM_dd"
        "formattedTime=$time" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Upload Harbour to artifact
      env:
         TIME: "${{ steps.current-time.outputs.formattedTime }}"
      uses: actions/upload-artifact@v4
      with:
       name: harbour_win32_mingw_${{ env.TIME }}
       path: output

  replace-release-asset:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Replace harbour_win32_mingw_* asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          art_dir=$(ls -d art/harbour_win32_mingw_*/ | head -1)
          name=$(basename "$art_dir")
          short=${TAG#core-}
          zip_name="${name}_core-${short}.zip"
          (cd "$art_dir" && zip -qr "$GITHUB_WORKSPACE/$zip_name" .)
          unzip -l "$zip_name" | tail -1
          for old in $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep '^harbour_win32_mingw_' || true); do
            [ "$old" = "$zip_name" ] || gh release delete-asset "$TAG" "$old" -R "$GITHUB_REPOSITORY" -y
          done
          gh release upload "$TAG" "$zip_name" -R "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep '^harbour_win32_mingw_'
